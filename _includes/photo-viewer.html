<dialog class="lightbox" aria-label="Photography viewer">
  <button class="lightbox-close" type="button" aria-label="Close photo viewer" autofocus>×</button>
  <button class="lightbox-prev" type="button" aria-label="Previous photograph">‹</button>
  <figure class="lightbox-figure">
    <img class="lightbox-image" alt="">
    <figcaption><span class="lightbox-caption"></span><span class="lightbox-count"></span></figcaption>
  </figure>
  <button class="lightbox-next" type="button" aria-label="Next photograph">›</button>
  <span class="lightbox-announcement" aria-live="polite"></span>
</dialog>
